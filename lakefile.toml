name = "Flapjack"
version = "0.1.0"
testDriver = "FlapjackTest"
defaultTargets = ["Flapjack", "FlapjackTest"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

# Ziren's executable MIPS32r2 model (`ZirenDet.Isa`), the semantics of the MIPS32 backend.
[[require]]
name = "ZirenDet"
git = "https://github.com/ProjectZKM/Ziren"
rev = "e08a98236d033f940160ccfe244dec12df0dddb0"
subDir = "crates/fv/lean4"

[[lean_lib]]
name = "Flapjack"

[[lean_exe]]
name = "FlapjackTest"
root = "Flapjack.Test.CompilerParity"

[[lean_exe]]
name = "flapjack-compile"
root = "Flapjack.CompileMain"

[[lean_exe]]
name = "flapjack-debug"
root = "Flapjack.DebugMain"

[[lean_exe]]
name = "flapjack-limit-var-bench"
root = "Flapjack.LimitVarBenchMain"

[[lean_exe]]
name = "flapjack-native-wordstack-profile"
root = "Flapjack.NativeWordStackProfileMain"
