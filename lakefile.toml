name = "Flapjack"
version = "0.1.0"
testDriver = "FlapjackTest"
defaultTargets = ["Flapjack"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "Flapjack"

[[lean_exe]]
name = "FlapjackTest"
root = "Flapjack.Test.CompilerParity"

[[lean_exe]]
name = "flapjack-compile"
root = "Flapjack.CompileMain"

[[lean_exe]]
name = "flapjack-debug"
root = "Flapjack.DebugMain"

[[lean_exe]]
name = "flapjack-limit-var-bench"
root = "Flapjack.LimitVarBenchMain"
