name = "Flapjack"
version = "0.1.0"
testDriver = "FlapjackTest"
defaultTargets = ["Flapjack", "FlapjackTest"]
# Lean 4.35's module-system mathlib warns when non-module files import it; keep
# the existing non-module sources working without emitting those warnings.
allowNonModules = true

# Ziren's executable MIPS32r2 model (`ZirenDet.Isa`), the semantics of the MIPS32 backend.
[[require]]
name = "ZirenDet"
git = "https://github.com/ProjectZKM/Ziren"
rev = "e08a98236d033f940160ccfe244dec12df0dddb0"
subDir = "crates/fv/lean4"

# Keep mathlib last so its pinned versions of shared dependencies take precedence.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Flapjack"

[[lean_exe]]
name = "FlapjackTest"
root = "Flapjack.Test.CompilerParity"

[[lean_exe]]
name = "flapjack-compile"
root = "Flapjack.CompileMain"

[[lean_exe]]
name = "cake"
root = "Flapjack.CakeMain"
